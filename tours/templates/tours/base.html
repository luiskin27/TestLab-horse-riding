<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Конные туры</title>
</head>
<body>
    <nav>
        {% if user.is_authenticated %}
            <a href="{% url 'profile' %}">Личный кабинет ({{ user.username }})</a> |
            <a href="{% url 'logout' %}">Выйти</a>
        {% else %}
            <a href="{% url 'login' %}">Вход</a> |
            <a href="{% url 'register' %}">Регистрация</a>
        {% endif %}
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
